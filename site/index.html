<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffdf9" />
    <title>LP 16기 나의 조 확인</title>
    <meta name="description" content="이름을 입력하고 랜덤박스를 열어 나의 조를 확인하세요." />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="phone-stage">
        <header class="site-header">
          <button id="backButton" class="icon-button hidden" type="button" aria-label="이름 입력으로 돌아가기">←</button>
          <span id="headerSpacer" class="header-spacer"></span>
          <div class="brand-lockup"><img src="./assets/lp-symbol.webp" alt="LP" /><span>LP 16기</span></div>
          <button id="resetButton" class="icon-button" type="button" aria-label="처음부터 다시 하기">↻</button>
        </header>

        <section id="lookupView" class="view lookup-view">
          <div class="eyebrow">✦ 나의 조 추첨</div>
          <h1>MT 조추첨 프로그램</h1>
          <p class="lead">본인 이름을 입력해주세요.</p>
          <form id="lookupForm" class="lookup-form">
            <label for="memberName">이름</label>
            <input id="memberName" type="text" placeholder="예: 박규민" autocomplete="name" enterkeyhint="done" maxlength="20" />
            <button type="submit">랜덤박스 뽑기</button>
            <p id="formMessage" class="form-message" aria-live="polite"></p>
          </form>
        </section>

        <section id="boxView" class="view box-view hidden">
          <div class="box-copy"><p id="boxOwner"></p><h1 id="boxTitle">박스를 눌러주세요</h1></div>
          <button id="mysteryBox" type="button" class="mystery-box" aria-label="랜덤박스 열기">
            <span class="box-aura"></span><span class="burst-ring ring-one"></span><span class="burst-ring ring-two"></span>
            <span id="sparks"></span>
            <img src="./assets/mystery-box.webp" alt="물음표 랜덤박스" />
          </button>
          <p id="tapHint" class="tap-hint">Tap to open</p>
        </section>

        <section id="resultView" class="view result-view hidden">
          <div id="confetti" class="confetti" aria-hidden="true"></div>
          <p class="result-label">배정된 조는</p>
          <h1 id="resultGroup"></h1>
          <button id="againButton" class="primary-button" type="button">확인 완료</button>
        </section>
      </section>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
